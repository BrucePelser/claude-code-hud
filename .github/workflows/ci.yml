name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.9", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Install fonttools (only the font test needs it)
        run: python -m pip install fonttools
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Demo renders
        run: python hud.py --demo
